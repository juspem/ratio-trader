[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq-gold-bot"
version = "0.1.0"
description = "An educational project for learning market data APIs and a simple trading strategy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-dotenv==1.2.4"]

[tool.setuptools.packages.find]
where = ["src"]
